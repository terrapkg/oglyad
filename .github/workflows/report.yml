name: report

# a nightly health report on terrapkg/packages, posted to the run's job summary
# and kept as an artifact. read-only: nothing here writes to any repo
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Terra's own build image, so specs evaluate with exactly the macros
    # Terra builds with (anda-srpm-macros and friends)
    container:
      image: ghcr.io/terrapkg/builder:f44
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oglyad
          persist-credentials: false

      # full history, since stale-build findings use each package's last commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: terrapkg/packages
          path: packages
          fetch-depth: 0
          persist-credentials: false

      # the container runs as root over checkouts owned by the runner user
      - name: Trust the checkouts
        run: git config --global --add safe.directory '*'

      # specs using a declarative BuildSystem: need that buildsystem's macros
      # just to be parsed, and the builder image doesn't ship meson's. without
      # this those specs show up as false rpmspec errors
      - name: Install buildsystem macros
        run: dnf5 -y -q install meson

      # build oglyad the way Terra packages it, which also proves every night
      # that the spec still builds against Fedora's Haskell libraries
      - name: Build and install oglyad
        working-directory: oglyad
        run: |
          version=$(rpmspec -q --srpm --qf '%{version}' packaging/terra/oglyad.spec)
          git archive --prefix="oglyad-$version/" -o "$RUNNER_TEMP/oglyad-$version.tar.gz" HEAD
          dnf5 -y -q builddep -D '_without_tests 1' packaging/terra/oglyad.spec
          rpmbuild -bb --without tests \
            --define "_sourcedir $RUNNER_TEMP" \
            --define "_topdir $RUNNER_TEMP/rpmbuild" \
            packaging/terra/oglyad.spec
          dnf5 -y -q install "$RUNNER_TEMP"/rpmbuild/RPMS/*/oglyad-*.rpm
          oglyad --version

      # spec evaluations, repodata and upstream answers carry over between
      # nights, so most runs only re-evaluate what changed
      - name: Restore cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oglyad
          key: oglyad-report-${{ github.run_id }}
          restore-keys: oglyad-report-

      # the second run is near instant, everything it needs is cached
      - name: Run oglyad
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          common=(-m packages -u --fedora -v --ignore-file oglyad/ignores.json --fail-on never)
          oglyad "${common[@]}" --format markdown > report.md
          oglyad "${common[@]}" --format json > report.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Save cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oglyad
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oglyad-report
          path: |
            report.md
            report.json
          retention-days: 30
