name: report

# a nightly health report on terrapkg/packages, posted to the run's job summary
# and kept as an artifact. read-only: nothing here writes to any repo
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: arc-runner-set
    container:
      image: ghcr.io/terrapkg/builder:f45
      # mock needs these to build oglyad in a chroot
      options: --cap-add=SYS_ADMIN --privileged
    timeout-minutes: 60
    steps:
      - name: Build oglyad
        uses: FyraLabs/anda-build@52228d9412072bc6acaa634f80f065c19fcef608 # main
        with:
          name: "oglyad-git"
          mockConfig: terra-45-x86_64

      - name: Install oglyad
        run: |
          dnf5 -y -q install $(find anda-build/rpm -name 'oglyad-*.rpm' ! -name '*.src.rpm')
          oglyad --version

      # full history, since stale-build findings use each package's last commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: terrapkg/packages
          path: packages
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkouts
        run: git config --global --add safe.directory '*'

      # specs using a declarative BuildSystem: need that buildsystem's macros
      # just to be parsed, and the builder image doesn't ship meson's. without
      # this those specs show up as false rpmspec errors
      - name: Install buildsystem macros
        run: dnf5 -y -q install meson

      # spec evaluations, repodata and upstream answers carry over between
      # nights, so most runs only re-evaluate what changed
      - name: Restore cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oglyad
          key: oglyad-report-${{ github.run_id }}
          restore-keys: oglyad-report-

      # the second run is near instant, everything it needs is cached
      - name: Run oglyad
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          common=(-m packages -u --fedora -v --ignore-file ignores.json --fail-on never)
          oglyad "${common[@]}" --format markdown > report.md
          oglyad "${common[@]}" --format json > report.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Save cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oglyad
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oglyad-report
          path: |
            report.md
            report.json
          retention-days: 30
